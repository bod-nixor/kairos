<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>Lesson</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/lms.css" />
  <link rel="stylesheet" href="./css/kairos-ui.css" />
  <script src="./js/config.js"></script>
</head>
<body class="k-page-body">
  <aside class="k-sidebar" id="kSidebar" role="navigation" aria-label="Course navigation">
    <a class="k-sidebar__brand" href="/signoff/" data-home-link="true" aria-label="Kairos home">
      <div class="k-sidebar__logo">
        <img class="k-brand-badge" src="./images/logo.png" alt="" />
      </div>
      <span class="k-sidebar__wordmark">Kairo<span>s</span></span>
    </a>
    <div class="k-sidebar__scroll">
      <div class="k-nav-group">
        <a class="k-nav-item" href="/signoff/" data-home-link="true">
          <span class="k-nav-item__icon" aria-hidden="true">&larr;</span>
          <span class="k-nav-item__text">All Courses</span>
        </a>
      </div>
      <div class="k-sidebar__course-header" id="kSidebarCourseHeader">
        <div class="k-sidebar__course-name" id="kSidebarCourseName">Course</div>
      </div>
      <nav class="k-nav-group" id="kNavCourse" aria-label="Course sections">
        <a class="k-nav-item" data-nav-key="home" data-course-href="./course.html" href="#">
          <span class="k-nav-item__icon" aria-hidden="true">H</span>
          <span class="k-nav-item__text">Home</span>
        </a>
        <a class="k-nav-item is-active" data-nav-key="modules" data-course-href="./modules.html" href="#" aria-current="page">
          <span class="k-nav-item__icon" aria-hidden="true">M</span>
          <span class="k-nav-item__text">Modules</span>
        </a>
        <a class="k-nav-item" data-nav-key="quizzes" data-course-href="./quizzes.html" href="#" id="kNavQuizzes">
          <span class="k-nav-item__icon" aria-hidden="true">Q</span>
          <span class="k-nav-item__text">Quizzes</span>
        </a>
        <a class="k-nav-item" data-nav-key="assignments" data-course-href="./assignments.html" href="#" id="kNavAssignments">
          <span class="k-nav-item__icon" aria-hidden="true">A</span>
          <span class="k-nav-item__text">Assignments</span>
        </a>
        <a class="k-nav-item hidden" data-nav-key="grading" data-course-href="./grading.html" href="#" id="kNavGrading">
          <span class="k-nav-item__icon" aria-hidden="true">G</span>
          <span class="k-nav-item__text">Grading</span>
        </a>
        <a class="k-nav-item hidden" data-nav-key="analytics" data-course-href="./analytics.html" href="#" id="kNavAnalytics">
          <span class="k-nav-item__icon" aria-hidden="true">N</span>
          <span class="k-nav-item__text">Analytics</span>
        </a>
      </nav>
    </div>
    <div class="k-sidebar__user">
      <img class="k-sidebar__avatar" id="kSidebarAvatar" src="" alt="" />
      <div class="k-sidebar__user-info">
        <div class="k-sidebar__user-name" id="kSidebarName">-</div>
        <div class="k-sidebar__user-role" id="kSidebarRole">Student</div>
      </div>
      <button class="k-sidebar__logout" id="kLogoutBtn" aria-label="Logout">&#8617;</button>
    </div>
  </aside>

  <div class="k-layout">
    <header class="k-topbar">
      <div class="k-topbar__left">
        <button class="k-hamburger hidden" id="kMobileMenuBtn" aria-label="Menu" aria-expanded="false" aria-controls="kSidebar">&#9776;</button>
        <nav class="k-breadcrumb" id="kBreadcrumb" aria-label="Breadcrumb">
          <a class="k-breadcrumb__item" href="/signoff/" data-home-link="true">All Courses</a>
          <span class="k-breadcrumb__sep" aria-hidden="true">&rsaquo;</span>
          <a class="k-breadcrumb__item" href="#" id="kBreadCourse">Course</a>
          <span class="k-breadcrumb__sep" aria-hidden="true">&rsaquo;</span>
          <a class="k-breadcrumb__item" href="#" id="kBreadModules">Modules</a>
          <span class="k-breadcrumb__sep" aria-hidden="true">&rsaquo;</span>
          <span class="k-breadcrumb__item is-current" id="kBreadLesson">Lesson</span>
        </nav>
      </div>
      <div class="k-topbar__actions">
        <button class="k-topbar__icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" data-theme-toggle>
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">&#9728;</span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">&#9790;</span>
        </button>
      </div>
    </header>

    <main class="k-main">
      <div class="k-page k-page--narrow">
        <div class="k-page-header">
          <div>
            <h1 class="k-page-header__title" id="lessonTitle">Lesson</h1>
            <p class="k-page-header__subtitle" id="lessonSubtitle"></p>
          </div>
          <div class="k-page-header__actions">
            <span id="lessonStatusPill" class="k-chip">Draft</span>
            <button class="btn btn-ghost btn-sm hidden" id="viewModeBtn" type="button">View</button>
            <button class="btn btn-ghost btn-sm hidden" id="editModeBtn" type="button">Edit</button>
            <button class="btn btn-primary btn-sm hidden" id="saveDraftBtn" type="button">Save Draft</button>
            <button class="btn btn-secondary btn-sm hidden" id="publishBtn" type="button">Publish</button>
            <button class="btn btn-ghost btn-sm hidden" id="unpublishBtn" type="button">Unpublish</button>
            <a class="btn btn-ghost btn-sm" id="backToModules" href="#">Back to Modules</a>
          </div>
        </div>

        <section id="editorWrap" class="hidden k-editor-group">
          <div class="k-editor-toolbar k-editor-toolbar--surface">
            <button class="btn btn-ghost btn-sm" data-cmd="formatBlock" data-cmd-value="h1" type="button">H1</button>
            <button class="btn btn-ghost btn-sm" data-cmd="formatBlock" data-cmd-value="h2" type="button">H2</button>
            <button class="btn btn-ghost btn-sm" data-cmd="formatBlock" data-cmd-value="h3" type="button">H3</button>
            <button class="btn btn-ghost btn-sm" data-cmd="bold" type="button">Bold</button>
            <button class="btn btn-ghost btn-sm" data-cmd="italic" type="button">Italic</button>
            <button class="btn btn-ghost btn-sm" data-cmd="underline" type="button">Underline</button>
            <button class="btn btn-ghost btn-sm" data-cmd="insertUnorderedList" type="button">Bullets</button>
            <button class="btn btn-ghost btn-sm" data-cmd="insertOrderedList" type="button">Numbered</button>
            <button class="btn btn-ghost btn-sm" id="addLinkBtn" type="button">Link</button>
            <button class="btn btn-ghost btn-sm" id="addPdfBtn" type="button">Insert PDF</button>
            <button class="btn btn-ghost btn-sm" id="addVideoBtn" type="button">Embed Video</button>
            <button class="btn btn-ghost btn-sm" id="copyMarkdownBtn" type="button">Copy Markdown</button>
          </div>
          <div id="lessonEditor" contenteditable="false" role="textbox" aria-multiline="true" aria-label="Lesson editor" class="k-card k-editor-surface"></div>
        </section>

        <div class="k-card">
          <article id="lessonContent" class="k-card__body"></article>
        </div>

        <div id="lessonAccessDenied" class="hidden"></div>

        <pre id="lessonDebug" class="k-card k-debug-panel hidden"></pre>
      </div>
    </main>
  </div>

  <dialog id="resourceModal" class="k-modal" aria-labelledby="resourceModalTitle">
    <form method="dialog" id="resourceModalForm" class="k-modal__card k-modal__content--sm">
      <header class="k-modal__header">
        <h3 class="k-modal__title" id="resourceModalTitle">Insert Resource</h3>
      </header>
      <div class="k-modal__body k-stack-sm">
        <div class="k-form-field">
          <label for="resourceTitle">Title</label>
          <input id="resourceTitle" type="text" placeholder="Resource title" required />
        </div>
        <div class="k-form-field">
          <label for="resourceUrl">URL</label>
          <input id="resourceUrl" type="url" placeholder="https://..." required />
        </div>
      </div>
      <footer class="k-modal__footer">
        <button type="button" id="resourceModalCancel" class="btn btn-ghost btn-sm">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" id="resourceModalSubmit">Insert</button>
      </footer>
    </form>
  </dialog>

  <script src="./js/theme.js"></script>
  <script src="./js/lms-core.js"></script>
  <script src="./js/lesson.js"></script>
</body>
</html>
