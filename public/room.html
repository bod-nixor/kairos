<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room</title>
  <link rel="icon" type="image/png" href="./images/logo.png" />
  <script>
    (() => {
      if (window.location.pathname.toLowerCase().includes('projector')) return;
      try {
        const stored = localStorage.getItem('kairos-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('theme-dark', theme === 'dark');
        document.documentElement.classList.toggle('theme-light', theme !== 'dark');
      } catch (err) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.classList.add('theme-light');
      }
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/room.css" />
  <link rel="stylesheet" href="./css/kairos-ui.css" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="./js/config.js"></script>
</head>
<body class="k-page-body room-view">
  <aside class="k-sidebar" id="kSidebar" role="navigation" aria-label="Room navigation">
    <a class="k-sidebar__brand" href="/signoff/" data-home-link="true" aria-label="Home">
      <div class="k-sidebar__logo"><img class="k-brand-badge" alt="" /></div>
      <span class="k-sidebar__wordmark"></span>
    </a>
    <div class="k-sidebar__scroll">
      <nav class="k-nav-group" aria-label="Global">
        <a class="k-nav-item" href="/signoff/" data-home-link="true">
          <span class="k-nav-item__icon" aria-hidden="true">&larr;</span>
          <span class="k-nav-item__text">Back to dashboard</span>
        </a>
      </nav>
      <nav class="k-nav-group" aria-label="Room">
        <div class="k-nav-group__label">Room</div>
        <div class="k-nav-item is-active" aria-current="page">
          <span class="k-nav-item__icon" aria-hidden="true">#</span>
          <span class="k-nav-item__text">Live queues</span>
        </div>
      </nav>
    </div>
  </aside>

  <div class="k-layout">
    <header class="k-topbar" role="banner">
      <div class="k-topbar__left">
        <button type="button" class="k-hamburger hidden" id="kMobileMenuBtn" aria-label="Menu" aria-expanded="false" aria-controls="kSidebar">&#9776;</button>
        <nav class="k-breadcrumb" aria-label="Breadcrumb">
          <a class="k-breadcrumb__item" href="/signoff/" data-home-link="true">Home</a>
          <span class="k-breadcrumb__sep" aria-hidden="true">&rsaquo;</span>
          <span class="k-breadcrumb__item is-current">Room</span>
        </nav>
      </div>
      <div class="k-topbar__actions">
        <a href="/signoff/" data-home-link="true" class="btn btn-ghost btn-sm">Back to dashboard</a>
        <button type="button" class="k-topbar__icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false" data-theme-toggle>
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">&#9728;</span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">&#127769;</span>
        </button>
      </div>
    </header>

    <main class="k-main room-main" id="roomMain">
      <section class="room-card" id="roomCard">
        <div class="room-card-header">
          <span class="badge" id="roomBadge">Room</span>
          <h1 id="roomTitle">Room</h1>
        </div>
        <div id="roomMeta" class="muted"></div>
        <div id="queuesContainer" class="queues-list"></div>
      </section>
    </main>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <script src="./js/theme.js"></script>
  <script src="./js/ws.js"></script>
  <script type="module" src="./js/room.js"></script>
</body>
</html>
